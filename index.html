<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man 3 Live Interactive Switch</title>
    <style>
        :root { 
            --bg-gradient: linear-gradient(135deg, #e3f2fd, #bbdefb); 
            --card-bg: linear-gradient(145deg, #e53935, #b71c1c);
            --shadow-color: rgba(229, 57, 53, 0.5);
            --text-color: #1565c0;
            --transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        body.black-mode { 
            --bg-gradient: linear-gradient(135deg, #0f0f0f, #1a002c); 
            --card-bg: linear-gradient(145deg, #212121, #0a0a0a);
            --shadow-color: rgba(123, 31, 162, 0.7);
            --text-color: #ce93d8;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            background: var(--bg-gradient); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            transition: var(--transition); 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Tanda Tangan Eksklusif By Mario di Pojok Kiri Atas */
        .credit {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: var(--transition);
            border: 1px solid rgba(255,255,255,0.6);
        }
        body.black-mode .credit { 
            background: rgba(0, 0, 0, 0.4); 
            border-color: rgba(255,255,255,0.1);
        }

        /* Kartu Karakter Spider-Man Hidup (Berdenyut Dinamis) */
        .hero-container {
            width: 280px; 
            height: 380px;
            background: var(--card-bg);
            border-radius: 32px;
            transition: var(--transition);
            box-shadow: 0 25px 50px var(--shadow-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: liveFloat 3.5s ease-in-out infinite;
            border: 3px solid rgba(255, 255, 255, 0.25);
        }

        @keyframes liveFloat { 
            0%, 100% { transform: translateY(0) scale(1); } 
            50% { transform: translateY(-10px) scale(1.02); } 
        }

        /* Topeng / Wajah Karakter */
        .mask {
            width: 130px; 
            height: 170px;
            background: #f44336;
            border-radius: 50% 50% 45% 45%;
            position: relative;
            box-shadow: inset 0 -12px 25px rgba(0,0,0,0.4), 0 5px 15px rgba(0,0,0,0.2);
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: breathe 2s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
