<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man 3 Switch Mode</title>
    <style>
        :root { 
            --bg-gradient: linear-gradient(135deg, #e0f7fa, #b2ebf2); 
            --card-bg: linear-gradient(145deg, #ff1744, #d50000);
            --shadow-color: rgba(255, 23, 68, 0.6);
            --accent: #00e5ff;
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        body.black-mode { 
            --bg-gradient: linear-gradient(135deg, #0f0f0f, #1a0033); 
            --card-bg: linear-gradient(145deg, #1f1f1f, #0a0a0a);
            --shadow-color: rgba(138, 43, 226, 0.8);
            --accent: #9c27b0;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            background: var(--bg-gradient); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            transition: var(--transition); 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .credit {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.15);
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: #333;
            backdrop-filter: blur(5px);
            transition: var(--transition);
        }
        body.black-mode .credit { color: #fff; background: rgba(255,255,255,0.1); }

        /* Kartu Karakter Spider-Man Hidup */
        .hero-container {
            width: 280px; height: 380px;
            background: var(--card-bg);
            border-radius: 30px;
            transition: var(--transition);
            box-shadow: 0 20px 40px var(--shadow-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: float 3s ease-in-out infinite;
            border: 3px solid rgba(255,255,255,0.2);
        }

        @keyframes float { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-12px); } 
        }

        /* Wajah / Topeng Spider-Man CSS */
        .mask {
            width: 140px; height: 180px;
            background: #ff1744;
            border-radius: 50% 50% 45% 45%;
            position: relative;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.4);
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body.black-mode .mask {
            background: #1a1a1a;
            box-shadow: inset 0 0 25px #7b1fa2, inset 0 -10px 20px rgba(0,0,0,0.8);
        }

        /* Mata Tajam Khas Spider-Man 3 */
        .eye {
            position: absolute;
            width: 45px; height: 28px;
            background: #f5f5f5;
            border-radius: 50% 20% 50% 20%;
            top: 65px;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
            transform: rotate(-15deg);
            transition: var(--transition);
        }
        .eye.right {
            transform: scaleX(-1) rotate(-15deg);
            left: auto; right: 22px;
        }
        .eye.left { left: 22px; }

        body.black-mode .eye {
            background: #e0f7fa;
            box-shadow: 0 0 15px var(--accent);
        }

        .title-text {
            margin-top: 25px;
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: var(--transition);
        }

        /* Tombol Switch Sesuai Permintaan (Di bawah, tidak terlalu ke bawah, ukuran pas) */
        .switch-wrapper {
            margin-top: 40px;
            width: 85px; height: 38px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 25px;
            display: flex; 
            align-items: center;
            padding: 4px; 
            cursor: pointer;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.4);
            transition: var(--transition);
            border: 2px solid rgba(255,255,255,0.3);
        }

        body.black-mode .switch-wrapper {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent);
        }

        .toggle-btn {
            width: 28px; height: 28px;
            background: #fff;
            border-radius: 50%;
            transition: var(--transition);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        body.black-mode .toggle-btn { 
            transform: translateX(47px); 
            background: #b388ff;
        }
    </style>
</head>
<body>

    <div class="credit">By Mario</div>

    <div class="hero-container" id="heroCard">
        <div class="mask">
            <div class="eye left"></div>
            <div class="eye right"></div>
        </div>
        <div class="title-text" id="heroTitle">Classic Suit</div>
    </div>
    
    <div class="switch-wrapper" onclick="toggleMode()">
        <div class="toggle-btn"></div>
    </div>

    <script>
        const body = document.body;
        const heroTitle = document.getElementById('heroTitle');

        function toggleMode() {
            body.classList.toggle('black-mode');
            
            if(body.classList.contains('black-mode')) {
                heroTitle.innerText = "Symbiote Suit";
            } else {
                heroTitle.innerText = "Classic Suit";
            }
        }
    </script>
</body>
</html>
