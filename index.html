<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man 3 Live Switch</title>
    <style>
        :root { 
            --bg-light: #e0f7fa; 
            --bg-dark: #121212;
            --shadow-red: rgba(229, 57, 53, 0.7);
            --shadow-black: rgba(123, 31, 162, 0.8);
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            background: var(--bg-light); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            transition: var(--transition); 
            overflow: hidden; 
            font-family: sans-serif;
        }

        body.black-mode { background: var(--bg-dark); }

        .credit {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            padding: 5px 15px; border-radius: 20px;
            font-weight: bold; font-size: 14px; color: #333;
            transition: var(--transition);
        }
        body.black-mode .credit { color: #fff; background: rgba(0, 0, 0, 0.5); }

        /* Kartu Foto Spider-Man Hidup */
        .hero-container {
            width: 280px; height: 380px;
            background-size: cover; background-position: center;
            border-radius: 25px;
            transition: var(--transition);
            box-shadow: 0 15px 35px var(--shadow-red);
            animation: floatCard 3s ease-in-out infinite;
            border: 3px solid rgba(255,255,255,0.3);
        }

        body.black-mode .hero-container {
            box-shadow: 0 15px 35px var(--shadow-black);
            border-color: rgba(123, 31, 162, 0.5);
        }

        @keyframes floatCard { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-10px); } 
        }

        /* Tombol Switch Kecil di Bawah */
        .switch-wrapper {
            margin-top: 40px;
            width: 75px; height: 34px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            display: flex; align-items: center;
            padding: 3px; cursor: pointer;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
            transition: var(--transition);
            border: 2px solid rgba(255,255,255,0.4);
        }

        body.black-mode .switch-wrapper {
            background: rgba(255, 255, 255, 0.15);
        }

        .toggle-btn {
            width: 24px; height: 24px;
            background: #ff1744;
            border-radius: 50%;
            transition: var(--transition);
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }

        body.black-mode .toggle-btn { 
            transform: translateX(41px); 
            background: #ab47bc;
        }
    </style>
</head>
<body>

    <div class="credit">By Mario</div>

    <div class="hero-container" id="hero"></div>
    
    <div class="switch-wrapper" onclick="toggleMode()">
        <div class="toggle-btn"></div>
    </div>

    <script>
        const hero = document.getElementById('hero');
        const body = document.body;

        // Kumpulan nama file foto Spider-Man kamu di GitHub
        // (Pastikan nama file gambarnya persis sama dengan yang kamu upload!)
        const redImages = [
            "1000257360.jpg", 
            "1000257358.jpg", 
            "1000257359.jpg"
        ];
        
        const blackImages = [
            "1000257356.jpg", 
            "1000257355.jpg", 
            "1000257352.jpg"
        ];

        function toggleMode() {
            body.classList.toggle('black-mode');
            
            // Ambil gambar acak dari array sesuai mode
            const list = body.classList.contains('black-mode') ? blackImages : redImages;
            const randomImg = list[Math.floor(Math.random() * list.length)];
            
            hero.style.backgroundImage = `url('${randomImg}')`;
        }

        // Set awal pas pertama kali kebuka (Mode Merah-Biru)
        hero.style.backgroundImage = `url('${redImages[0]}')`;
    </script>
</body>
</html>
